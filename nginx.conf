# Config do nginx da imagem Docker (ver Dockerfile). Em produção (Dokku) vale o app-nginx.conf.sigil;
# mantenha os cabeçalhos de segurança iguais nos dois arquivos (issue #107).
# Este arquivo é um template da imagem nginx:alpine: ${API_URL} é preenchido no start com envsubst.

# Cache: arquivos com hash em /assets/ ficam 1 ano; index.html sempre revalida.
# Fica num map para não usar add_header dentro de location (o que anularia os cabeçalhos do server).
map $uri $cache_control {
  ~^/assets/    "public, max-age=31536000, immutable";
  default       "no-cache";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${API_URL}; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
  add_header Cache-Control $cache_control;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
